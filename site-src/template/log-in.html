<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="Log_In.css">
    <title>Log In — Davinci Custom-Garage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@400;600;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

</head>
<body>

    <div id="box">

        <!-- ── LEFT : LOGO ── -->
        <div id="box-img">
            <a href="home.html">
                <img src="Garage.png" alt="Davinci Custom-Garage" class="box-img">
            </a>
        </div>

        <!-- ── RIGHT : FORM ── -->
        <div id="box_credentials">

            <h2 class="box-title">Log In into your<br>Driver's Account</h2>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="xxxxx@gmail.com">
            </div>

            <div class="form-group">
                <label for="pwd">Password</label>
                <input type="password" id="pwd" name="pwd" placeholder="Enter your password">
            </div>

            <button class="btn-submit">Submit</button>

            <div class="box-account">
                Doesn't have an account ? <a href="Sign_Up.html">Sign Up</a>
            </div>

            <div class="divider">
                <span class="line"></span>
                <span class="label">Or connect with</span>
                <span class="line"></span>
            </div>

            <div class="connect">
                <a href=""><img src="google.png" alt="Google"></a>
                <a href=""><img src="git.png" alt="GitHub"></a>
                <a href=""><img src="steam.png" alt="Steam"></a>
            </div>

        </div>
    </div>

</body>
</html>
